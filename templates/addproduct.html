<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Mezali Users</title>
<link href="{{ url_for('static', filename='theme.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container"> 
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"> 
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"> 
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg>
                <span class="fs-4">Mezali Data Center</span>
            </a>
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="/" class="nav-link " aria-current="page">Home</a></li>
                <li class="nav-item"><a href="/users" class="nav-link ">Users</a></li> 
                <li class="nav-item"><a href="/products" class="nav-link active">products</a></li> 
                <li class="nav-item"><a href="/faqs" class="nav-link">FAQs</a></li> 
            </ul> 
        </header> 
    </div>

    <div class="p-3 container shadow rounded w-50 d-flex flex-wrap justify-content-center">
        <form action="/products" method="post">
            <h1 class="h4 text-primary mb-1">Register Product</h1>
            <br>
            <label class="form-label" for="name">Product name</label>
            <input class="form-control" type="text" name = "name">
            <label class="form-label" for="img">Image link of the product</label>
            <input class="form-control" class="form-label" type="text" name = "img">
            <label class="form-label" for="price">Price</label>
            <input class="form-control" type="number" name = "price">
            <label class="form-label" for="decryption">Decryption</label>
            <input class="form-control" type="text" name = "decryption">
            <br>
            <button class="btn btn-primary" type="submit">add product</button>
        </form>
    </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="{{ url_for('static', filename='theme.js') }}"></script>
</html>
