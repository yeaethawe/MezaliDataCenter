<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Add Product · Mezalion</title>
    <link href="{{ url_for('static', filename='theme.css') }}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='mezalion-icon.png') }}">
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img class="me-2" src="{{ url_for('static', filename='mezalion-icon.png') }}" alt="" width="40" height="40">
                <span class="fs-4">Mezalion</span>
            </a>
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="/products" class="nav-link active">products</a></li>
                <li class="nav-item"><a href="/faqs" class="nav-link">FAQs</a></li>
            </ul>
        </header>
    </div>

    <div class="p-3 container shadow rounded w-50 d-flex flex-wrap justify-content-center">
        <form action="{{ url_for('products') }}" method="post" enctype="multipart/form-data">
            <h1 class="h4 text-primary mb-3">Register Product</h1>
            <label class="form-label" for="name">Product name</label>
            <input class="form-control mb-2" id="name" type="text" name="name" required>
            <label class="form-label" for="photo">Product photo</label>
            <input class="form-control mb-2" id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/gif,image/webp" required>
            <label class="form-label" for="price">Price</label>
            <input class="form-control mb-2" id="price" type="number" name="price" min="0" step="1" required>
            <label class="form-label" for="decryption">Description</label>
            <textarea class="form-control mb-3" id="decryption" name="decryption" rows="6" required placeholder="Describe the product…"></textarea>
            <button class="btn btn-primary" type="submit">Add product</button>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
