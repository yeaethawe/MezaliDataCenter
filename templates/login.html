{% extends "index.html" %}

{% block title %}Sign In · Mezalion{% endblock %}

{% block content %}
<div class="auth-shell">
    <form class="auth-card" action="{{ url_for('login_user_page') }}" method="POST">
        <h1>Sign In</h1>
        <p class="auth-lead">Access your Mezalion workspace.</p>
        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-3" type="email" id="email" name="email" autocomplete="email" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" type="password" id="password" name="password" autocomplete="current-password" required>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
            <label class="form-check-label" for="remember_me">Remember me</label>
        </div>
        <button class="intro-cta" type="submit">Sign In</button>
        <p class="auth-switch">Need an account? <a href="{{ url_for('register_user_page') }}">Get Started</a></p>
    </form>
</div>
{% endblock %}
