{% extends "index.html" %}

{% block title %}Get Started · Mezalion{% endblock %}

{% block content %}
<div class="auth-shell">
    <form class="auth-card" action="{{ url_for('users_route') }}" method="POST">
        <h1>Get Started</h1>
        <p class="auth-lead">Create your Mezalion account.</p>
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" type="text" id="username" name="username" autocomplete="username" required>
        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-3" type="email" id="email" name="email" autocomplete="email" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" type="password" id="password" name="password" autocomplete="new-password" required>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
            <label class="form-check-label" for="remember_me">Remember me</label>
        </div>
        <button class="intro-cta" type="submit">Create account</button>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login_user_page') }}">Sign In</a></p>
    </form>
</div>
{% endblock %}
