<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mezalion IDE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='ide.css') }}" rel="stylesheet">
</head>
<body>
<div class="ide-shell">
    <header class="ide-titlebar">
        <div class="ide-brand">
            <img src="{{ url_for('static', filename='mezalion-icon.png') }}" alt="" width="20" height="20">
            <span>Mezalion IDE</span>
        </div>
        <div class="ide-actions">
            <button type="button" class="ide-btn ide-btn-primary" id="ide-save" disabled title="Ctrl+S">Save</button>
            <button type="button" class="ide-btn" id="ide-refresh-tree" title="Refresh explorer">Refresh</button>
            <a class="ide-btn" href="{{ url_for('file_explorer') }}">Files</a>
            <a class="ide-btn" href="{{ url_for('dashboard') }}">Dashboard</a>
        </div>
    </header>
    <div class="ide-workspace">
        <nav class="ide-activity" aria-label="Activity bar">
            <button type="button" id="toggle-sidebar" class="active" title="Explorer" aria-label="Toggle explorer">
                <i class="bi bi-files" aria-hidden="true"></i>
            </button>
        </nav>
        <aside class="ide-sidebar" id="ide-sidebar">
            <div class="ide-sidebar-header">
                <span>Explorer</span>
                <div class="ide-sidebar-actions">
                    <button type="button" class="ide-icon-btn" id="ide-new-file" title="New File" aria-label="New file">
                        <i class="bi bi-file-earmark-plus" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="ide-icon-btn" id="ide-new-folder" title="New Folder" aria-label="New folder">
                        <i class="bi bi-folder-plus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="ide-selected-path" id="ide-selected-path">Root</div>
            <div class="ide-drop-root" id="ide-drop-root" title="Drop here to move to Root">Root</div>
            <div class="ide-tree" id="ide-tree" role="tree" aria-label="Files"></div>
        </aside>
        <section class="ide-editor-pane">
            <div class="ide-tabs" id="ide-tabs" role="tablist" aria-label="Open editors"></div>
            <div id="ide-empty" class="ide-empty">
                <div>
                    <h2>Mezalion IDE</h2>
                    <p>Click a folder to expand it. Open code to edit, or images/videos to preview.<br>Drag to move. Ctrl+S saves editable files.</p>
                </div>
            </div>
            <div id="monaco-editor" style="display:none;"></div>
            <div id="ide-preview" class="ide-preview" style="display:none;" aria-live="polite"></div>
        </section>
    </div>
    <footer class="ide-status">
        <div class="ide-status-left">
            <span id="status-file">No file open</span>
            <span id="status-dirty">Saved</span>
        </div>
        <div class="ide-status-right">
            <span id="status-cursor">Ln —, Col —</span>
            <span id="status-lang">—</span>
            <span>UTF-8</span>
        </div>
    </footer>
</div>
<div id="ide-toast" class="ide-toast" role="status" aria-live="polite"></div>

<div class="ide-ctx-menu" id="ide-context-menu" role="menu" aria-hidden="true">
    <button type="button" data-ide-ctx="copy" role="menuitem"><i class="bi bi-clipboard" aria-hidden="true"></i> Copy</button>
    <button type="button" data-ide-ctx="paste" role="menuitem"><i class="bi bi-clipboard-check" aria-hidden="true"></i> Paste</button>
    <button type="button" data-ide-ctx="move" role="menuitem"><i class="bi bi-arrows-move" aria-hidden="true"></i> Move…</button>
    <div class="ide-ctx-sep" role="separator"></div>
    <button type="button" data-ide-ctx="detail" role="menuitem"><i class="bi bi-info-circle" aria-hidden="true"></i> Detail</button>
    <button type="button" data-ide-ctx="delete" class="danger" role="menuitem"><i class="bi bi-trash" aria-hidden="true"></i> Delete</button>
</div>

<div class="ide-modal-backdrop" id="ide-detail-modal" aria-hidden="true">
    <div class="ide-modal" role="dialog" aria-labelledby="ide-detail-title">
        <div class="ide-modal-header">
            <h2 id="ide-detail-title">Details</h2>
            <button type="button" class="ide-icon-btn" data-ide-close="ide-detail-modal" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <div class="ide-modal-body">
            <dl class="ide-detail-grid" id="ide-detail-body"></dl>
        </div>
        <div class="ide-modal-footer">
            <button type="button" class="ide-btn" data-ide-close="ide-detail-modal">Close</button>
        </div>
    </div>
</div>

<div class="ide-modal-backdrop" id="ide-move-modal" aria-hidden="true">
    <div class="ide-modal" role="dialog" aria-labelledby="ide-move-title">
        <div class="ide-modal-header">
            <h2 id="ide-move-title">Move to…</h2>
            <button type="button" class="ide-icon-btn" data-ide-close="ide-move-modal" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <div class="ide-modal-body">
            <label class="ide-muted" for="ide-move-select" style="display:block;margin-bottom:0.4rem;font-size:0.85rem;">Destination folder</label>
            <select class="ide-folder-pick" id="ide-move-select"></select>
        </div>
        <div class="ide-modal-footer">
            <button type="button" class="ide-btn" data-ide-close="ide-move-modal">Cancel</button>
            <button type="button" class="ide-btn ide-btn-primary" id="ide-move-confirm">Move</button>
        </div>
    </div>
</div>

<script>
    window.__IDE_OPEN_FILE__ = {{ open_file | tojson }};
</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="{{ url_for('static', filename='ide.js') }}"></script>
</body>
</html>
